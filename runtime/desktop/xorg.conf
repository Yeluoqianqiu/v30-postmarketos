Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "V30 framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
EndSection

Section "Screen"
    Identifier "V30 screen"
    Device "V30 framebuffer"
    DefaultDepth 24
EndSection

Section "InputClass"
    Identifier "V30 native portrait touch"
    MatchProduct "stmfts"
    MatchIsTouchscreen "on"
    Driver "libinput"
    Option "TransformationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection

Section "Extensions"
    Option "GLX" "Disable"
EndSection
