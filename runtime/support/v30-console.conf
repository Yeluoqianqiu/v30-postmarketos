# Physical tty1 only; /bin/login still performs authentication.
set-option -g default-shell /bin/sh
set-option -g default-command 'exec /sbin/getty -i -L 38400 - screen'
set-option -g status-position top
set-option -g status 4
set-option -g status-interval 0
set-option -g status-style 'fg=white,bg=black'
set-option -g default-terminal screen
set-option -g mouse off
set-option -g prefix None
set-option -g prefix2 None
unbind-key -q -a -T prefix
unbind-key -q -a -T root
set-option -g allow-passthrough off
set-option -g set-clipboard off
set-window-option -g allow-rename off
set-window-option -g automatic-rename off
set-window-option -g remain-on-exit off
set-option -g exit-empty on
set-option -g destroy-unattached on
set-option -g history-limit 2000
set-option -g visual-bell off
set-option -g bell-action none
set-option -g status-format[0] ' Reading system status... '
set-option -g status-format[1] ' '
set-option -g status-format[2] ' '
set-option -g status-format[3] ' '
